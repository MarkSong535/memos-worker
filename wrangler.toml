name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
binding = "ASSETS"
directory = "./src/public"
run_worker_first = [
	"/",
	"/index.html",
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "4bfd25f6-9b93-415a-b1e9-1db408bd43b0"
database_name = "memos-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "ddc0889570d44bf28b5d08d83d0ad638"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "memos"
preview_bucket_name = "notes-files-preview"

[vars]
OIDC_CLIENT_ID = "oucLomeuniIPugbjZP8RG84ECk2atMHDOLVazPGf"
OIDC_DISCOVERY_URL = "https://anonymunication.ch/application/o/notes/.well-known/openid-configuration"
APP_ORIGIN = "https://n.markso.ng"
