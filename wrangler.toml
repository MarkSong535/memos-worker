name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "4bfd25f6-9b93-415a-b1e9-1db408bd43b0"
database_name = "memos-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "memos-kv"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "memos"
preview_bucket_name = "notes-files-preview"
